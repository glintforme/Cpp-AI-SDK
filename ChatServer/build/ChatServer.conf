# =========================================
# AIChatServer 默认配置文件
# 版本: 1.0.0
# =========================================

# 服务器绑定地址
--host=0.0.0.0

# 服务器绑定端口号
--port=8080

# 日志级别: TRACE, DEBUG, INFO, WARN, ERROR, CRITICAL
--log_level=INFO

# 温度值，影响生成文本的随机性，范围 0.0~2.0
# 值越高回答越随机，值越低回答越确定
--temperature=0.7

# 最大token数，限制模型生成的最大长度
--max_tokens=2048

# =========================================
# Ollama 本地模型配置
# 默认使用本地部署的 deepseek-r1:1.5b
# =========================================
# Ollama模型名称，需要与 Ollama 服务端已拉取的模型名一致
--ollama_model_name=deepseek-r1:1.5b

# Ollama模型描述，用于在前端展示
--ollama_model_desc=本地 DeepSeek R1 1.5B 推理模型

# Ollama API服务地址
--ollama_endpoint=http://127.0.0.1:11434

# =========================================
# 云端 API 密钥配置 (通过环境变量设置)
# =========================================
# DeepSeek API Key: 设置环境变量 deepseek_apikey
#   示例: export deepseek_apikey=sk-xxxxxx
#
# KIMI3 API Key: 设置环境变量 KIMI3_apikey
#   示例: export KIMI3_apikey=sk-xxxxxx
#
# Gemini API Key: 设置环境变量 gemini_apikey
#   示例: export gemini_apikey=xxxxxx
