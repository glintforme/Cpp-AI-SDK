<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天助手</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Markdown 渲染库 marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码语法高亮 highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <!-- KaTeX 数学公式渲染引擎 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-robot logo-icon"></i>
                    <span class="logo-text">AI聊天助手</span>
                </div>
                <button class="new-chat-btn" id="headerNewChatBtn" title="创建新对话">
                    <i class="fas fa-plus"></i>
                    新建对话
                </button>
            </div>
            <div class="header-right">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">就绪</span>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 左侧会话列表 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title"><i class="fas fa-history"></i> 历史会话</span>
                    <span class="session-count" id="sessionCount">0</span>
                </div>
                <div class="session-list" id="sessionList">
                    <!-- 会话列表将通过JavaScript动态加载 -->
                    <div class="empty-sessions">
                        <i class="fas fa-inbox"></i>
                        <p>暂无会话记录</p>
                        <p class="empty-hint">点击右上角"新建对话"开始</p>
                    </div>
                </div>
            </aside>

            <!-- 右侧聊天区域 -->
            <main class="chat-area">
                <!-- 默认欢迎界面 -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-content">
                        <div class="welcome-icon">
                            <i class="fas fa-comments"></i>
                        </div>
                        <h2 class="welcome-title">选择一个历史对话继续，</h2>
                        <h2 class="welcome-title">或创建新的对话，开启您的AI之旅</h2>
                        <button class="welcome-new-chat-btn" id="welcomeNewChatBtn">
                            <i class="fas fa-plus-circle"></i>
                            新建对话
                        </button>
                        <div class="welcome-features">
                            <div class="feature-item">
                                <i class="fas fa-bolt"></i>
                                <span>极速响应</span>
                            </div>
                            <div class="feature-item">
                                <i class="fas fa-shield-alt"></i>
                                <span>隐私保护</span>
                            </div>
                            <div class="feature-item">
                                <i class="fas fa-code"></i>
                                <span>代码高亮</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 聊天界面 -->
                <div class="chat-interface" id="chatInterface" style="display: none;">
                    <!-- 聊天头部（显示当前模型） -->
                    <div class="chat-header" id="chatHeader">
                        <span class="current-model-label">当前模型:</span>
                        <span class="current-model-name" id="currentModelName">-</span>
                    </div>

                    <!-- 聊天消息显示区域 (要求: 主页面85%高度) -->
                    <div class="messages-container" id="messagesContainer">
                        <!-- 消息将通过JavaScript动态加载 -->
                    </div>

                    <!-- 输入区域 -->
                    <div class="input-area">
                        <div class="input-container">
                            <textarea
                                id="messageInput"
                                class="message-input"
                                placeholder="请输入您的消息...(Enter发送，Shift+Enter换行)"
                                maxlength="2000"
                                rows="1"
                            ></textarea>
                            <div class="input-footer">
                                <span class="char-count" id="charCount">0/2000</span>
                                <button class="send-btn" id="sendBtn" disabled>
                                    <i class="fas fa-paper-plane"></i>
                                    <span>发送</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 模型选择弹窗（无边框窗口） -->
    <div class="modal-overlay" id="modelModal" style="display: none;">
        <div class="model-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-cube"></i> 选择模型</h3>
                <button class="close-btn" id="closeModalBtn" aria-label="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="model-grid" id="modelGrid">
                    <!-- 模型列表将通过JavaScript动态加载 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelBtn">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button class="btn btn-confirm" id="confirmBtn" disabled>
                    <i class="fas fa-check"></i> 确定
                </button>
            </div>
        </div>
    </div>

    <!-- 全局提示 Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
